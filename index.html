<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rundown Reminder</title>

  <link rel="manifest" href="manifest.json">
</head>

<body>

  <h1>🔔 Rundown Reminder</h1>

  <p>Push Notification untuk iPhone</p>

  <button id="btnNotify">
    Aktifkan Notifikasi
  </button>

  <p id="status">Status: belum aktif</p>

<textarea
  id="subscription"
  style="width:100%;height:250px;"
  placeholder="Push Subscription akan muncul di sini"
  readonly>
</textarea>

<script>
  const button = document.getElementById("btnNotify");
  const status = document.getElementById("status");

  const VAPID_PUBLIC_KEY =
    "BAVbjufsgrcrh31uDK3NsjhbRGAv70nhCNSk3rwKsrKc5oPruonYmpAUWXes3CKPWXushHcfKG97Z59_GnizQv8";

  function urlBase64ToUint8Array(base64String) {
    const padding = "=".repeat((4 - base64String.length % 4) % 4);

    const base64 = (base64String + padding)
      .replace(/-/g, "+")
      .replace(/_/g, "/");

    const rawData = atob(base64);

    return Uint8Array.from(
      [...rawData].map(char => char.charCodeAt(0))
    );
  }

  async function aktifkanNotifikasi() {

    try {

      const registration =
        await navigator.serviceWorker.register(
          "./service-worker.js"
        );

      await navigator.serviceWorker.ready;

      const permission =
        await Notification.requestPermission();

      if (permission !== "granted") {
        status.textContent =
          "❌ Izin notifikasi belum diberikan.";
        return;
      }

      let subscription =
        await registration.pushManager.getSubscription();

      if (!subscription) {

        subscription =
          await registration.pushManager.subscribe({

            userVisibleOnly: true,

            applicationServerKey:
              urlBase64ToUint8Array(
                VAPID_PUBLIC_KEY
              )
          });
      }

document.getElementById("subscription").value =
  JSON.stringify(subscription);

      status.textContent =
        "✅ iPhone sudah terdaftar untuk Push Notification.";

      alert(
        "Berhasil! iPhone sudah terdaftar."
      );

    } catch (error) {

      console.error(error);

      status.textContent =
        "❌ Error: " + error.message;
    }
  }

  button.addEventListener(
    "click",
    aktifkanNotifikasi
  );
</script>
  
</body>
</html>
