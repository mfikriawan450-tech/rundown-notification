<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rundown Reminder</title>

  <link rel="manifest" href="manifest.json">
</head>

<body>

  <h1>🔔 Rundown Reminder</h1>

  <p>Push Notification untuk iPhone</p>

  <button id="btnNotify">
    Aktifkan Notifikasi
  </button>

  <p id="status">Status: belum aktif</p>

<script>
  const button = document.getElementById("btnNotify");
  const status = document.getElementById("status");

  async function aktifkanNotifikasi() {

    if (!("serviceWorker" in navigator)) {
      status.textContent =
        "❌ Service Worker tidak didukung.";
      return;
    }

    if (!("Notification" in window)) {
      status.textContent =
        "❌ Notifikasi tidak didukung.";
      return;
    }

    try {

      const registration =
        await navigator.serviceWorker.register(
          "./service-worker.js"
        );

      console.log(
        "Service Worker aktif:",
        registration
      );

      const permission =
        await Notification.requestPermission();

      if (permission === "granted") {

        status.textContent =
          "✅ Notifikasi sudah diizinkan.";

        alert(
          "Notifikasi berhasil diaktifkan!"
        );

      } else if (permission === "denied") {

        status.textContent =
          "❌ Notifikasi ditolak.";

      } else {

        status.textContent =
          "⚠️ Izin notifikasi belum diberikan.";
      }

    } catch (error) {

      console.error(error);

      status.textContent =
        "❌ Terjadi error: " + error.message;
    }
  }

  button.addEventListener(
    "click",
    aktifkanNotifikasi
  );
</script>
</body>
</html>
